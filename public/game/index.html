<script>
	// 结束检测：到达最终成果页（出现"感谢游玩"文案）后显示"再来一局 / 退出"
	(function () {
		var box = document.getElementById('game-end-actions');
		var shown = false;
		var showTimer = null;

		function isEndPage() {
			try { return document.body.innerText.indexOf('感谢游玩') >= 0; }
			catch (e) { return false; }
		}
		function getScene() {
			try { return window.Mugeda && Mugeda.currentAni && Mugeda.currentAni._getScene(); }
			catch (e) { return null; }
		}
		function showBox() {
			if (!shown) { shown = true; box.style.display = 'block'; }
		}
		function hideBox() {
			shown = false;
			if (showTimer) { clearTimeout(showTimer); showTimer = null; }
			box.style.display = 'none';
		}
		// 轮询检测结束页；离开结束页（如重开）时隐藏
		setInterval(function () {
			if (isEndPage()) {
				if (!shown && !showTimer) {
					showTimer = setTimeout(function () { showTimer = null; showBox(); }, 1500);
				}
			} else if (shown || showTimer) {
				hideBox();
			}
		}, 400);

		document.getElementById('gea-again').addEventListener('click', function () {
			hideBox();
			var sc = getScene();
			if (sc && sc.gotoPage) sc.gotoPage(0); // 回到第一页，重新开始
		});
		document.getElementById('gea-exit').addEventListener('click', function () {
			location.href = '/'; // 返回首页
		});
	})();
</script>
